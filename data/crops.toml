# --------------------------------------------------------------------------- quality risks

[quality.aflatoxin_window]
crop = "maize"
window = "flowering"
rule = "count days with Tmax > 33 °C in the window; flag if >= 7 AND window rain below the multi-year mean"
tmax_c = 33.0
min_days = 7
confidence = "medium"
review = true
notes = "From the 2015 French outbreak: contaminated samples came only from areas with >33 °C on more than seven days during maize flowering plus a rainfall deficit. Mechanism well established (heat + drought favour Aspergillus flavus); the threshold is borrowed."
sources = ["Bailly et al. 2018, Toxins (hal.inrae.fr hal-02624195)"]

[quality.fusarium_window]
crop = "wheat"
window = ["flowering_minus_7", "flowering_plus_10"]
rule = "count days with RH2M >= 85% or rain >= 1 mm, 7 days before to 10 days after anthesis"
rh_pct = 85.0
rain_mm = 1.0
confidence = "low"
review = true
notes = "Infection is favoured by 48-72 h at >90% RH and 15-30 °C; US risk models use the 7 days before and 10 days after anthesis. POWER gives daily mean RH, which understates night-time humidity, so 85% daily mean is a proxy."
sources = ["De Wolf, Madden & Lipps 2003, Phytopathology 93:428-435"]

[quality.harvest_rain]
crop = "all"
window = "harvest"
rule = "rain in the harvest window above the 80th percentile of the record"
confidence = "low"
review = true
notes = "Placeholder rule; ask the buyer what they actually reject lots for."
sources = []

# --------------------------------------------------------------------------- rotation rules

[rotation]
confidence = "low"
review = true
notes = "Minimum years before the same crop (or family) returns to the field. MUST come from the agronomist; values below are common rules of thumb only."

[rotation.min_return_years]
maize = 1            # monoculture possible but raises western corn rootworm pressure
wheat = 2            # wheat after wheat raises disease pressure
barley = 2
soybean = 3
sunflower = 5        # Sclerotinia, broomrape
pea = 4              # root rot
fabaceae_family = 3  # any legume after any legume

[rotation.good_predecessors]
wheat = ["soybean", "pea", "sunflower", "cover_vetch"]
maize = ["soybean", "pea", "wheat", "barley", "cover_vetch"]
soybean = ["wheat", "barley", "maize"]
sunflower = ["wheat", "barley"]
pea = ["wheat", "barley", "maize"]
