name: Deploy

# Every push to main that passes CI ships both apps to Azure Container Apps: the web app on
# https://fieldsignal.land, the API on https://api.fieldsignal.land. Azure login is OIDC (no stored password):
# repo secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RG: rg-field-signal
  ACR: fieldsignal952178
  REGISTRY: fieldsignal952178.azurecr.io
  PUBLIC_URL: https://fieldsignal.land

jobs:
  deploy:
    # Only after a green CI run of a push to main (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login -n "$ACR"

      - uses: docker/setup-buildx-action@v3

      # Parcel outlines for "tap your parcel" (data/scripts/build_apia_parcels.py), kept out of git.
      - name: Fetch APIA parcel outlines
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apia-parcels-2025 -p apia_parcels_alba.sqlite -D services/api/parcels --clobber

      # Soil and terrain grid of the trained world model (data/src/farm_data/static_grid.py);
      # without it the farm planner falls back to the mock world model.
      - name: Fetch world model soil grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download world-model-static -p static_grid.npy -D services/api/src/api/planner/data --clobber

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/field-signal-api:${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # The browser calls the API on its own subdomain (same site, so the sign-in cookie works).
          build-args: NEXT_PUBLIC_API_URL=https://api.fieldsignal.land
          tags: ${{ env.REGISTRY }}/field-signal:${{ env.TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Roll out
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp update -g "$RG" -n field-signal-api --image "$REGISTRY/field-signal-api:$TAG" -o none
          az containerapp update -g "$RG" -n field-signal --image "$REGISTRY/field-signal:$TAG" -o none

      - name: Smoke test
        run: |
          for url in https://api.fieldsignal.land/health "$PUBLIC_URL/ro" "$PUBLIC_URL/en/buyers"; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url") || true
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$code $url"
            [ "$code" = 200 ] || exit 1
          done
