[project]
name = "farm-titans-field-shift"
version = "0.1.0"
description = "Farm Titans — NASA Space Apps Challenge 2026 (Field Shift) monorepo root"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "data", "ml"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps", "node_modules", "data/raw", "data/cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["api", "farm_data", "farm_ml"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "services/api/src"
explicit_package_bases = true
