[project]
name = "api"
version = "0.1.0"
description = "Field Signal FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "twilio>=9.13.0",
  "openai>=3.51.0",
  "python-multipart>=0.0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
