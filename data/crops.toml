# Field Signal crop knowledge base: SPACE2FEED Direction A (livestock feed), Alba county.
#
# STATUS: DRAFT v0.1 (13 Nov 2026). NOT REVIEWED BY AN AGRONOMIST.
# Every value has a confidence level. Anything marked `review = true` must be checked with a
# mentor or agronomist on Saturday morning before it is shown to a farmer or a judge.
#
# Dates are MM-DD for Alba county (Transylvanian plateau, ~250 m). They shift with hybrid,
# sowing date and year; the pipeline should treat them as windows, not exact days.
# Season = harvest year. Winter crops are sown in the previous calendar year.
#
# Loaded by data/src/farm_data/crops.py (stdlib tomllib, no extra dependency).

version = "0.1.0-draft"
region = "Alba county, Romania"

# --------------------------------------------------------------------------- feed crops

[crops.maize]
name = { ro = "Porumb", en = "Maize" }
family = "poaceae"
season_type = "summer"
sowing = ["04-10", "05-05"]
flowering = ["07-10", "08-05"]        # silking; heat-critical window
harvest = ["09-20", "10-31"]
water_need = "high"
drought_tolerance = "low"
heat_watch_tmax_c = 32.0              # seed set starts falling above ~32 °C at flowering
heat_bad_tmax_c = 35.0                # larger losses above ~35 °C
nitrogen_fixing = false
rooting_depth_m = 1.5
feed_use = "energy (grain), ~60-65% of a typical poultry ration"
confidence = "medium"
review = true
notes = """
Heat thresholds come from flowering-stage experiments on Chinese hybrids (Tmax 32/35 °C over
the 15 days around silking); transfer to Romanian hybrids is unverified. Sowing window: early
April sowing is reported in Transylvania; optimum germination around 10 °C soil temperature.
"""
sources = ["researchsquare rs-3388464 (flowering Tmax 32/35 °C)", "usamvcluj.ro thesis summary (soil temp)", "corteva.com/ro (Transylvania sowing from 2 Apr)"]

