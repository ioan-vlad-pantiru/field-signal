harvest = ["07-10", "08-05"]
water_need = "medium"
drought_tolerance = "medium"
heat_watch_tmax_c = 30.0              # grain-fill heat in June
heat_bad_tmax_c = 34.0
frost_kill_tmin_c = -18.0             # hardened plants without snow cover; placeholder
nitrogen_fixing = false
rooting_depth_m = 1.2
feed_use = "energy + some protein"
confidence = "medium"
review = true
notes = "Anthesis dates for Alba are estimates (later than the southern plain). Frost-kill threshold is a placeholder; snow cover is not modelled."
